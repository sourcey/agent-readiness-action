name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.3
      # Sourcey's release chain projects every byte here from Catalog; nothing is edited by hand.
      - name: The bundle is the projection's exact bytes
        run: |
          test "$(jq --raw-output .bundle_sha256 SOURCEY-BUNDLE.json)" = "sha256:$(sha256sum dist/run.mjs | cut -d' ' -f1)"
      - run: node --check dist/run.mjs
