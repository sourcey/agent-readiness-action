name: Sourcey Agent Readiness

# An account holder's workflow calls this one at a released commit:
#   uses: sourcey/agent-readiness-action/.github/workflows/run.yml@<commit>
# The job's signing identity names this workflow at that commit, and the caller
# cannot add a step to its job, so what Sourcey verifies is exactly this run.
on:
  workflow_call:
    inputs:
      profile:
        description: The profile ID from your report card's Verify the job page (arp_...).
        required: true
        type: string
      binding:
        description: The binding ID from the same page.
        required: true
        type: string
      refresh_token_secret:
        description: The name of the secret holding your refresh token, which the Action replaces when your service issues a new one. Needs secrets_token.
        required: false
        type: string
    secrets:
      credentials:
        description: The JSON the Verify the job page shows, filled in with your credentials and the job's inputs.
        required: true
      refresh_token:
        description: Your refresh token, kept out of credentials so a new one can be written back to it.
        required: false
      secrets_token:
        description: A GitHub token with Secrets write on this repository only, used only to write a new refresh token back.
        required: false

permissions: {}

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      id-token: write
    steps:
      - name: Locate this workflow's commit
        id: action
        # The job's own OIDC token names the reusable workflow and the commit it runs at.
        run: |
          token="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://github.com/sourcey/agent-readiness-action" \
            | jq --raw-output .value)"
          claims="$(python3 -c 'import base64, sys; part = sys.argv[1].split(".")[1]; print(base64.urlsafe_b64decode(part + "=" * (-len(part) % 4)).decode())' "$token")"
          echo "repository=$(jq --raw-output '.job_workflow_ref | split("/.github/")[0]' <<<"$claims")" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq --raw-output .job_workflow_sha <<<"$claims")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ steps.action.outputs.repository }}
          ref: ${{ steps.action.outputs.commit }}
          path: .sourcey-agent-readiness-action
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.3
      - name: Run the job and submit it
        env:
          SOURCEY_PROFILE: ${{ inputs.profile }}
          SOURCEY_BINDING: ${{ inputs.binding }}
          SOURCEY_CREDENTIALS: ${{ secrets.credentials }}
          SOURCEY_REFRESH_TOKEN: ${{ secrets.refresh_token }}
          SOURCEY_SECRETS_TOKEN: ${{ secrets.secrets_token }}
          SOURCEY_REFRESH_TOKEN_SECRET: ${{ inputs.refresh_token_secret }}
        run: node .sourcey-agent-readiness-action/dist/run.mjs
